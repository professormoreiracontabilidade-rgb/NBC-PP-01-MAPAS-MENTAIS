<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b68">
<title>NBC PP 01 (R2) — Professor Moreira</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#dff3ff;font-family:Arial,sans-serif;color:#063b68}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}
.app{width:min(100%,560px);min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;flex:1;touch-action:pan-y}
#slide{display:block;max-width:100%;max-height:calc(100dvh - 94px);width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 4px 18px #0002;user-select:none;-webkit-user-drag:none}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:9px}
button{border:0;border-radius:12px;background:#07599b;color:#fff;font-weight:700;min-height:46px;padding:0 17px;font-size:22px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.35}
#reset{background:#c62828;font-size:15px;padding:0 14px}
#count{min-width:68px;text-align:center;font-weight:800;font-size:17px}
@media (max-width:420px){.app{padding-left:6px;padding-right:6px}.bar{gap:7px}button{min-width:54px;padding:0 12px}}
</style>
</head>
<body>
<main class="app" aria-label="Carrossel NBC PP 01 R2">
  <section class="stage" id="stage">
    <img id="slide" src="imagens/01.webp" alt="Slide 1 de 20" draggable="false" decoding="async" fetchpriority="high">
  </section>
  <nav class="bar" aria-label="Controles do carrossel">
    <button id="prev" type="button" aria-label="Imagem anterior">←</button>
    <span id="count" aria-live="polite">1 / 20</span>
    <button id="next" type="button" aria-label="Próxima imagem">→</button>
    <button id="reset" type="button">Reiniciar</button>
  </nav>
</main>
<script>
(() => {
  const total=20, img=document.getElementById('slide'), count=document.getElementById('count');
  const prev=document.getElementById('prev'), next=document.getElementById('next'), reset=document.getElementById('reset');
  const stage=document.getElementById('stage');
  let current=1, startX=0, startY=0;
  const path=n=>`imagens/${String(n).padStart(2,'0')}.webp`;
  function preload(n){ if(n>=1&&n<=total){ const p=new Image(); p.src=path(n); } }
  function show(n){
    current=Math.max(1,Math.min(total,n));
    img.src=path(current); img.alt=`Slide ${current} de ${total}`;
    count.textContent=`${current} / ${total}`;
    prev.disabled=current===1; next.disabled=current===total;
    preload(current+1);
  }
  prev.addEventListener('click',()=>show(current-1));
  next.addEventListener('click',()=>show(current+1));
  reset.addEventListener('click',()=>show(1));
  stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});
  stage.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-startX, dy=t.clientY-startY;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.2) show(current+(dx<0?1:-1));
  },{passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') show(current-1);
    if(e.key==='ArrowRight') show(current+1);
    if(e.key==='Home') show(1);
  });
  show(1);
})();
</script>
</body>
</html>
